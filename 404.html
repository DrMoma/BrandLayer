<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not found — Brand Layer</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#FAFAFA" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
<link rel="stylesheet" href="/assets/fonts/fonts.css" />
<script defer src="/_vercel/insights/script.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; color: #0B0710; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: #987AD1; color: white; }
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .card { max-width: 560px; width: 100%; text-align: center; }
  .code { font-family: 'DM Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #5E309C; }
  h1 { margin: 16px 0 8px; font-size: clamp(34px, 6vw, 56px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .sub { margin: 0 0 36px; color: rgba(11,7,16,0.6); font-size: 17px; line-height: 1.5; }

  /* The studio's signature mac window, in miniature */
  .window {
    position: relative;
    width: 100%; max-width: 460px; margin: 0 auto; text-align: left;
    background: #fff; border-radius: 8px;
    box-shadow: inset 0 0 0 1px rgba(11,7,16,0.10), 0 24px 60px -45px rgba(50,22,85,0.4);
    overflow: hidden;
  }
  .titlebar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid rgba(11,7,16,0.06); }
  .dots { display: flex; gap: 8px; }
  .dots span { width: 12px; height: 12px; border-radius: 999px; background: rgba(11,7,16,0.12); transition: background 150ms ease; }
  .dots:hover span:nth-child(1) { background: #ff5f56; }
  .dots:hover span:nth-child(2) { background: #febc2e; }
  .dots:hover span:nth-child(3) { background: #28c840; }
  .filename { margin-left: 4px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; color: rgba(11,7,16,0.45); }
  .pill { margin-left: auto; font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; padding: 2px 8px; border-radius: 999px; background: rgba(225,29,72,0.09); color: #BE123C; }

  .codeblock { padding: 16px 20px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.9; white-space: pre; overflow-x: auto; cursor: text; caret-color: transparent; }
  .codeblock:focus { outline: none; }
  .codeblock:focus .caret { display: none; } /* the block caret overlay takes over while typing */
  .caret-typing {
    display: none; position: absolute; width: 7px;
    background: rgba(130,89,197,0.7);
    animation: blink 1.1s steps(2, start) infinite;
    pointer-events: none;
  }
  .reset {
    position: absolute; right: 8px; bottom: 8px;
    display: grid; place-items: center; width: 24px; height: 24px;
    border: 0; border-radius: 999px; padding: 0;
    background: rgba(11,7,16,0.04); color: rgba(11,7,16,0.3);
    cursor: pointer; transition: background 150ms ease, color 150ms ease;
  }
  .reset:hover { background: rgba(11,7,16,0.08); color: rgba(11,7,16,0.7); }
  .p   { color: rgba(11,7,16,0.35); }  /* punctuation */
  .tag { color: #5E309C; }             /* tag names */
  .atr { color: #047857; }             /* attributes */
  .str { color: #D97706; }             /* strings */
  .txt { color: rgba(11,7,16,0.8); }   /* text content */
  .com { color: rgba(11,7,16,0.3); font-style: italic; }
  .caret { display: inline-block; width: 7px; height: 1.05em; margin-left: 4px; vertical-align: -2px; background: rgba(130,89,197,0.7); animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .caret, .caret-typing { animation: none; } }

  a.btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 32px; padding: 14px 22px; border-radius: 999px; background: #0B0710; color: white; text-decoration: none; font-weight: 500; font-size: 14px; box-shadow: 0 8px 30px -10px rgba(94,48,156,0.55); transition: background 0.2s ease; }
  a.btn:hover { background: #5E309C; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="code">404 · not found</div>
      <h1>This page doesn't exist.</h1>
      <p class="sub">It may have moved, or never existed. Head back to the studio.</p>

      <div class="window">
        <div class="titlebar">
          <div class="dots"><span></span><span></span><span></span></div>
          <span class="filename">lost-page.html</span>
          <span class="pill">404 · 0 results</span>
        </div>
        <div class="codeblock" contenteditable="true" spellcheck="false" aria-label="Editable sample code — type in it if you like"><span class="com">&lt;!-- this URL never shipped --&gt;</span>
<span class="p">&lt;</span><span class="tag">section</span> <span class="atr">class</span><span class="p">=</span><span class="str">"lost"</span><span class="p">&gt;</span>
  <span class="p">&lt;</span><span class="tag">h1</span><span class="p">&gt;</span><span class="txt">Nothing to see here.</span><span class="p">&lt;/</span><span class="tag">h1</span><span class="p">&gt;</span>
  <span class="p">&lt;</span><span class="tag">a</span> <span class="atr">href</span><span class="p">=</span><span class="str">"/"</span><span class="p">&gt;</span><span class="txt">Back to the studio →</span><span class="p">&lt;/</span><span class="tag">a</span><span class="p">&gt;</span>
<span class="p">&lt;/</span><span class="tag">section</span><span class="p">&gt;</span><span class="caret"></span></div>
        <button type="button" class="reset" aria-label="Reset code to original" title="Reset code">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>

      <a class="btn" href="/">Back to Brand Layer</a>
    </div>
  </div>
  <script>
    (function () {
      var code = document.querySelector('.codeblock');
      var win = document.querySelector('.window');
      var orig = code.innerHTML;
      code.addEventListener('paste', function (e) {
        e.preventDefault();
        var t = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, t);
      });
      code.addEventListener('keydown', function (e) { if (e.key === 'Escape') code.blur(); });

      // Same block caret as the site's animated one, drawn at the real
      // selection (the native caret is hidden via caret-color).
      var typing = document.createElement('span');
      typing.className = 'caret-typing';
      typing.setAttribute('aria-hidden', 'true');
      win.appendChild(typing);

      function caretRect() {
        var sel = getSelection();
        if (!sel || !sel.rangeCount || !sel.isCollapsed) return null;
        var range = sel.getRangeAt(0);
        if (!code.contains(range.startContainer)) return null;
        var r = range.getClientRects()[0] || range.getBoundingClientRect();
        if (!r || (!r.height && !r.width && !r.top && !r.left)) {
          // Collapsed range on an empty line reports no rect — measure a
          // zero-width marker instead, then put the selection back.
          var m = document.createElement('span');
          m.textContent = '\u200B';
          range.cloneRange().insertNode(m);
          r = m.getBoundingClientRect();
          var p = m.parentNode;
          p.removeChild(m);
          if (p.normalize) p.normalize();
          sel.removeAllRanges();
          sel.addRange(range);
        }
        return r;
      }

      function update() {
        var r = document.activeElement === code ? caretRect() : null;
        if (!r) { typing.style.display = 'none'; return; }
        var w = win.getBoundingClientRect();
        var fs = parseFloat(getComputedStyle(code).fontSize) || 12;
        var h = fs * 1.05;
        typing.style.height = h + 'px';
        typing.style.left = (r.left - w.left) + 'px';
        typing.style.top = (r.top - w.top + (r.height - h) / 2) + 'px';
        typing.style.display = 'block';
      }

      var raf = 0;
      function queue() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; update(); }); }
      document.addEventListener('selectionchange', queue);
      code.addEventListener('scroll', queue, { passive: true });
      code.addEventListener('blur', queue);
      code.addEventListener('focus', queue);
      window.addEventListener('resize', queue);

      document.querySelector('.reset').addEventListener('click', function () { code.innerHTML = orig; queue(); });
    })();
  </script>
</body>
</html>
